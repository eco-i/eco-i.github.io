name: QA 2-8-243 real Chrome same-token epoch boundary
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-243-epoch.yml"
      - "qa-handoff/QA_243_EPOCH_SMOKE.cjs"
      - "qa-handoff/index.working-2-8-243.html"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa243epoch --no-audit --no-fund playwright-core@1.55.1
      - name: Verify real mobile and desktop epoch-reset RPC ownership
        env:
          NODE_PATH: /tmp/qa243epoch/node_modules
        run: node qa-handoff/QA_243_EPOCH_SMOKE.cjs
