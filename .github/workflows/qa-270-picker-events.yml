name: QA 2-8-270 picker event isolated ownership regression
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-270-picker-events.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  picker-events:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa270pickevents --no-audit --no-fund playwright-core@1.55.1
      - name: Chromium mobile desktop repeated change, missed change watchdog and cancel recovery
        env:
          NODE_PATH: /tmp/qa270pickevents/node_modules
        run: node qa-handoff/QA_270_PICKER_EVENTS.cjs
