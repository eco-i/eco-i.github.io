name: QA 2-8-236 Chromium deep session tests
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-236-smoke.yml"
      - "qa-handoff/QA_236_SMOKE.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa-236 --no-audit --no-fund playwright-core@1.55.1
      - name: Run actual Chromium multi-tab session tests
        env:
          NODE_PATH: /tmp/qa-236/node_modules
        run: node qa-handoff/QA_236_SMOKE.cjs
