name: QA 2-8-253 actual admin UI revocation
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-253-admin-ui.yml"
      - "qa-handoff/QA_253_ADMIN_UI.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa253admin --no-audit --no-fund playwright-core@1.55.1
      - name: Chrome admin authorization purge after quota and shared logout
        env:
          NODE_PATH: /tmp/qa253admin/node_modules
        run: node qa-handoff/QA_253_ADMIN_UI.cjs
