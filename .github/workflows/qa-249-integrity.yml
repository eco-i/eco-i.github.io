name: QA 2-8-249 independent source integrity audit
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-249-integrity.yml"
      - "qa-handoff/QA_249_INTEGRITY.cjs"
      - "qa-handoff/index.working-2-8-249.html"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Immutable baseline, exact candidate SHA, syntax and DOM ID and source diff
        run: node qa-handoff/QA_249_INTEGRITY.cjs
