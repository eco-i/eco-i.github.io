name: QA 2-8-259 personnel and identity RPC boundaries
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-259-personnel.yml"
      - "qa-handoff/QA_259_PERSONNEL.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  personnel:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa259person --no-audit --no-fund playwright-core@1.55.1
      - name: Verify strict employee status, assignment, identity and DOM injection boundaries PC/mobile
        env:
          NODE_PATH: /tmp/qa259person/node_modules
        run: node qa-handoff/QA_259_PERSONNEL.cjs
