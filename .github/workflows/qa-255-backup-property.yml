name: QA 2-8-255 randomized backup valid-malformed schema matrix
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-255-backup-property.yml"
      - "qa-handoff/QA_255_BACKUP_PROPERTY.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  property:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa255prop --no-audit --no-fund playwright-core@1.55.1
      - name: 6144 personal/admin backup section and schema cases PC/mobile
        env:
          NODE_PATH: /tmp/qa255prop/node_modules
        run: node qa-handoff/QA_255_BACKUP_PROPERTY.cjs
