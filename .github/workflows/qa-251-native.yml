name: QA 2-8-251 native confirm ownership chromium
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-251-native.yml"
      - "qa-handoff/QA_251_NATIVE_REVOCATION.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa251native --no-audit --no-fund playwright-core@1.55.1
      - name: Native modal confirm prompt two-tab protected RPC boundary
        env:
          NODE_PATH: /tmp/qa251native/node_modules
        run: node qa-handoff/QA_251_NATIVE_REVOCATION.cjs
