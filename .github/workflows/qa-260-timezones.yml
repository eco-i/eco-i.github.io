name: QA 2-8-260 global timezone and DST independent Chrome matrix
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-260-timezones.yml"
      - "qa-handoff/QA_260_GLOBAL_TIMEZONE.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  date-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa260timezone --no-audit --no-fund playwright-core@1.55.1
      - name: 8 timezone PC/mobile Chromium and 14 DST and year crossover instants
        env:
          NODE_PATH: /tmp/qa260timezone/node_modules
        run: node qa-handoff/QA_260_GLOBAL_TIMEZONE.cjs
