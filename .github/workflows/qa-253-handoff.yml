name: QA 2-8-253 deferred handoff native confirmation
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-253-handoff.yml"
      - "qa-handoff/QA_253_HANDOFF_DIALOG.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa253native --no-audit --no-fund playwright-core@1.55.1
      - name: Two-tab Chrome cancel deferred-save RPC ownership test
        env:
          NODE_PATH: /tmp/qa253native/node_modules
        run: node qa-handoff/QA_253_HANDOFF_DIALOG.cjs
