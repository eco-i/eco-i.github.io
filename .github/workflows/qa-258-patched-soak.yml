name: QA 2-8-258 patched-source sustained multi-domain Chrome audit
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-258-patched-soak.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extended:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa258patchedsoak --no-audit --no-fund playwright-core@1.55.1
      - name: Repeat updated-candidate Chrome domain/security batteries for nine real minutes
        env:
          NODE_PATH: /tmp/qa258patchedsoak/node_modules
        shell: bash
        run: |
          set -euo pipefail
          names="QA_256_FULL QA_256_RESTORE_RACE QA_256_BACKUP_PROPERTY QA_256_CODEC_FUZZ QA_256_SCOPE_MATRIX QA_256_ANNUAL_LEAVE_MATRIX QA_256_PICKER_REAL QA_258_UNTRUSTED_UI QA_257_RPC_CONTRACT QA_257_SEOUL_MIDNIGHT"
          node qa-handoff/QA_258_ADAPT.cjs $names
          began=$(date +%s)
          end=$((began+540))
          round=0
          total=0
          while [ "$(date +%s)" -lt "$end" ]; do
            round=$((round+1))
            echo "QA258_PATCHED_SOAK_ROUND_BEGIN $round"
            for name in $names; do
              if ! node qa-handoff/QA_258_ADAPTED_${name}.cjs > /tmp/qa258-patched-soak.log 2>&1; then
                echo "QA258_PATCHED_SOAK_FAILURE round=$round suite=$name"
                tail -n 24 /tmp/qa258-patched-soak.log
                exit 1
              fi
              total=$((total+1))
              grep 'SUMMARY' /tmp/qa258-patched-soak.log | tail -n 1 | cut -c 1-350 || true
            done
            echo "QA258_PATCHED_SOAK_ROUND_PASS round=$round total_suite_runs=$total elapsed_seconds=$(($(date +%s)-began))"
          done
          echo "QA258_PATCHED_SOAK_FINAL_PASS rounds=$round total_suite_runs=$total actual_seconds=$(($(date +%s)-began))"
