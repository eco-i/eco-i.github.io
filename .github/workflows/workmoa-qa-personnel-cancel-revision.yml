        if: success()
        run: |
          echo 'QA-only source contract PASS, not a real PostgreSQL/PostgREST/Auth/E2E execution.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Production main remains untouched; 3-8-54 BLOCKED / NOT CLEAN.' >> "$GITHUB_STEP_SUMMARY"
