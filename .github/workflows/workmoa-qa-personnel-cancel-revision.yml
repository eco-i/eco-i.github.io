    branches: [qa-3-8]
    paths:
      - 'index.html'
      - 'qa-round3/tests/personnel-batch-cancel-revision.test.cjs'
      - '.github/workflows/workmoa-qa-personnel-cancel-revision.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
