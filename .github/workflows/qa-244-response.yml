name: QA 2-8-244 actual Chromium admin response fencing
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-244-response.yml"
      - "qa-handoff/QA_244_ADMIN_RESPONSE.cjs"
      - "qa-handoff/index.working-2-8-244.html"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa244resp --no-audit --no-fund playwright-core@1.55.1
      - name: Real Chrome privileged async response revocation test
        env:
          NODE_PATH: /tmp/qa244resp/node_modules
        run: node qa-handoff/QA_244_ADMIN_RESPONSE.cjs
