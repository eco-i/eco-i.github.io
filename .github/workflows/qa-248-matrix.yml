name: QA 2-8-248 scope matrix real Chromium
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-248-matrix.yml"
      - "qa-handoff/QA_248_SCOPE_MATRIX.cjs"
      - "qa-handoff/index.working-2-8-248.html"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa248matrix --no-audit --no-fund playwright-core@1.55.1
      - name: Exhaustive 648-case real Chrome desktop and Android scope matrix
        env:
          NODE_PATH: /tmp/qa248matrix/node_modules
        run: node qa-handoff/QA_248_SCOPE_MATRIX.cjs
