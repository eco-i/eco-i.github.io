name: QA 2-8-250 native confirm two-tab Chromium
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-250-native.yml"
      - "qa-handoff/QA_250_NATIVE_REVOCATION.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa250extra --no-audit --no-fund playwright-core@1.55.1
      - name: Real Chrome independent security regression
        env:
          NODE_PATH: /tmp/qa250extra/node_modules
        run: node qa-handoff/QA_250_NATIVE_REVOCATION.cjs
