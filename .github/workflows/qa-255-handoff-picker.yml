name: QA 2-8-255 native handoff and actual picker
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-255-handoff-picker.yml"
      - "qa-handoff/QA_255_HANDOFF_DIALOG.cjs"
      - "qa-handoff/QA_255_PICKER_REAL.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa255native --no-audit --no-fund playwright-core@1.55.1
      - name: Native confirm shared ownership PC two tabs
        env:
          NODE_PATH: /tmp/qa255native/node_modules
        run: node qa-handoff/QA_255_HANDOFF_DIALOG.cjs
      - name: Real PC and mobile image picker change and cancellation
        env:
          NODE_PATH: /tmp/qa255native/node_modules
        run: node qa-handoff/QA_255_PICKER_REAL.cjs
