# QA245 final clean-branch source/SHA recheck before 245 official handoff
name: QA 2-8-245 immutable source integrity
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-245-integrity.yml"
      - "qa-handoff/QA_245_INTEGRITY.cjs"
      - "qa-handoff/index.working-2-8-245.html"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exact SHA bytes scoped diff JS syntax and DOM IDs
        run: node qa-handoff/QA_245_INTEGRITY.cjs
