name: QA 2-8-237 real Chromium regression
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-237-smoke.yml"
      - "qa-handoff/QA_237_SMOKE.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa-237 --no-audit --no-fund playwright-core@1.55.1
      - name: Execute full browser regression
        env:
          NODE_PATH: /tmp/qa-237/node_modules
        run: node qa-handoff/QA_237_SMOKE.cjs
