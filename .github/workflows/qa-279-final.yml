name: QA 2-8-279 promoted 280 baseline SHA and real Chrome boot
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-279-final.yml"
      - "qa-handoff/index.before-2-8-280.html"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  final-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa279final --no-audit --no-fund playwright-core@1.55.1
      - name: Verify official 279 state, 280 immutable start and real Chrome PC/mobile boot
        env:
          NODE_PATH: /tmp/qa279final/node_modules
        run: node qa-handoff/QA_279_POST_PROMOTE.cjs
