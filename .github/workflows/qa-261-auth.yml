name: QA 2-8-261 auth identity token fuzz PC mobile
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-261-auth.yml"
      - "qa-handoff/QA_261_AUTH_CONTRACT.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa261auth --no-audit --no-fund playwright-core@1.55.1
      - name: Real Chrome PC/mobile strict auth token identity and sentinel rejection matrix
        env:
          NODE_PATH: /tmp/qa261auth/node_modules
        run: node qa-handoff/QA_261_AUTH_CONTRACT.cjs
