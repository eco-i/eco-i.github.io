name: QA 2-8-259 fingerprint and image contract fuzz
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-259-fingerprint.yml"
      - "qa-handoff/QA_259_FINGERPRINT.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa259fingerprint --no-audit --no-fund playwright-core@1.55.1
      - name: Independent real Chrome PC/mobile fingerprint RPC and image decoding validation
        env:
          NODE_PATH: /tmp/qa259fingerprint/node_modules
        run: node qa-handoff/QA_259_FINGERPRINT.cjs
