name: QA 2-8-260 responsive calendar/viewport stress
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-260-responsive.yml"
      - "qa-handoff/QA_260_RESPONSIVE.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa260responsive --no-audit --no-fund playwright-core@1.55.1
      - name: PC/mobile real Chrome viewports from 320px to desktop in light/dark theme
        env:
          NODE_PATH: /tmp/qa260responsive/node_modules
        run: node qa-handoff/QA_260_RESPONSIVE.cjs
