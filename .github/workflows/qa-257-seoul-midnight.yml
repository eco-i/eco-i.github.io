name: QA 2-8-257 Korean-midnight timezone Chrome audit
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-257-seoul-midnight.yml"
      - "qa-handoff/QA_257_SEOUL_MIDNIGHT.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa257midnight --no-audit --no-fund playwright-core@1.55.1
      - name: Real Chrome fixed-KST calendar date boundary, desktop and mobile
        env:
          NODE_PATH: /tmp/qa257midnight/node_modules
        run: node qa-handoff/QA_257_SEOUL_MIDNIGHT.cjs
