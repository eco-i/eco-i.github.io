name: QA 2-8-258 native backup download Unicode roundtrip
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-258-backup-download.yml"
      - "qa-handoff/QA_258_BACKUP_ROUNDTRIP.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa258rt --no-audit --no-fund playwright-core@1.55.1
      - name: Real PC/mobile Chromium file save and JSON data restore parser roundtrip
        env:
          NODE_PATH: /tmp/qa258rt/node_modules
        run: node qa-handoff/QA_258_BACKUP_ROUNDTRIP.cjs
