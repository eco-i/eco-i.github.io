name: QA 2-8-249 PC-mobile scope matrix Chromium
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-249-matrix.yml"
      - "qa-handoff/QA_249_SCOPE_MATRIX.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa249matrix --no-audit --no-fund playwright-core@1.55.1
      - name: Browser 648-state remembered and temporary authorization matrix
        env:
          NODE_PATH: /tmp/qa249matrix/node_modules
        run: node qa-handoff/QA_249_SCOPE_MATRIX.cjs
