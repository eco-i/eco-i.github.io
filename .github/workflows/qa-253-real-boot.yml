name: QA 2-8-253 cold boot authority and quota revocation
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-253-real-boot.yml"
      - "qa-handoff/QA_253_REAL_BOOT.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cold:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa253cold --no-audit --no-fund playwright-core@1.55.1
      - name: Real cold boot delayed RPC and quota/reload revocation checks
        env:
          NODE_PATH: /tmp/qa253cold/node_modules
        run: node qa-handoff/QA_253_REAL_BOOT.cjs
