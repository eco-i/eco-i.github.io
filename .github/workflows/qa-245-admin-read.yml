name: QA 2-8-245 Chrome privileged read authorization
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-245-admin-read.yml"
      - "qa-handoff/QA_245_ADMIN_READ.cjs"
      - "qa-handoff/index.working-2-8-245.html"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa245reads --no-audit --no-fund playwright-core@1.55.1
      - name: Admin-only reads when unlock revoked and restored in real Chrome
        env:
          NODE_PATH: /tmp/qa245reads/node_modules
        run: node qa-handoff/QA_245_ADMIN_READ.cjs
