name: QA 2-8-249 candidate Chromium GREEN
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-249-green.yml"
      - "qa-handoff/QA_249_DUAL_SCOPE_GREEN.cjs"
      - "qa-handoff/index.working-2-8-249.html"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa249green --no-audit --no-fund playwright-core@1.55.1
      - name: Browser two-tab revocation with reload replay and isolated-tab control
        env:
          NODE_PATH: /tmp/qa249green/node_modules
        run: node qa-handoff/QA_249_DUAL_SCOPE_GREEN.cjs
