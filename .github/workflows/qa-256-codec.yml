name: QA 2-8-256 16384 independent schema fuzz properties
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-256-codec.yml"
      - "qa-handoff/QA_256_CODEC_FUZZ.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa256codec --no-audit --no-fund playwright-core@1.55.1
      - name: Independent 16384 randomized restore schema validation in Chrome
        env:
          NODE_PATH: /tmp/qa256codec/node_modules
        run: node qa-handoff/QA_256_CODEC_FUZZ.cjs
