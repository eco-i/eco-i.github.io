name: QA 2-8-243 exact source-delta integrity
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-243-integrity.yml"
      - "qa-handoff/QA_243_INTEGRITY.cjs"
      - "qa-handoff/index.working-2-8-243.html"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify bytes, SHA, source-only substitutions, JS and DOM IDs
        run: node qa-handoff/QA_243_INTEGRITY.cjs
