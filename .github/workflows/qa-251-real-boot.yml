# QA251 final pinned candidate independent post-fix repeat
name: QA 2-8-251 actual cold load quota browser
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-251-real-boot.yml"
      - "qa-handoff/QA_251_REAL_BOOT_QUOTA.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa251boot --no-audit --no-fund playwright-core@1.55.1
      - name: Real cold boot with paused auth RPC session deletion and quota plus reload
        env:
          NODE_PATH: /tmp/qa251boot/node_modules
        run: node qa-handoff/QA_251_REAL_BOOT_QUOTA.cjs
