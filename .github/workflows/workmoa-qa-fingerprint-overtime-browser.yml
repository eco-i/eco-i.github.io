name: Workmoa QA real fingerprint and overtime UI to disposable PostgreSQL
on:
  push:
    branches: [qa-3-8]
    paths:
      - 'qa-round3/e2e/ci/browser-fingerprint-overtime-success.py'
      - 'qa-round3/e2e/ci/fingerprint-overtime-browser-fixture.sql'
      - 'qa-round3/e2e/ci/browser-attendance-form.py'
      - 'qa-round3/e2e/ci/browser-postgres-bridge.py'
      - '.github/workflows/workmoa-qa-fingerprint-overtime-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workmoa-qa-fingerprint-overtime-browser
  cancel-in-progress: true
jobs:
  real-chromium-fake-pg-success:
    if: github.repository == 'eco-i/eco-i.github.io' && github.ref == 'refs/heads/qa-3-8'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qa_runner
          POSTGRES_PASSWORD: synthetic_ci_only_not_a_real_secret
          POSTGRES_DB: qa_round3
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U qa_runner -d qa_round3"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: qa_round3
      PGUSER: qa_runner
      PGPASSWORD: synthetic_ci_only_not_a_real_secret
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Local-only environment and browser dependency validation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = eco-i/eco-i.github.io
          test "$GITHUB_REF" = refs/heads/qa-3-8
          test "$(git branch --show-current)" = qa-3-8
          test -z "${DATABASE_URL:-}"
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${QA_SUPABASE_URL:-}"
          test -z "${QA_SUPABASE_ANON_KEY:-}"
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          python3 -m pip install --disable-pip-version-check 'playwright==1.56.0' 'psycopg[binary]==3.2.10'
          python3 -m playwright install --with-deps chromium
          python3 -m py_compile qa-round3/e2e/ci/browser-fingerprint-overtime-success.py
      - name: Seed disposable synthetic PostgreSQL only
        run: |
          psql -X -v ON_ERROR_STOP=1 -f qa-round3/e2e/ci/synthetic-baseline.sql
          psql -X -v ON_ERROR_STOP=1 -f qa-round3/e2e/ci/attendance-form-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f qa-round3/e2e/ci/fingerprint-overtime-browser-fixture.sql
      - name: Real Chromium photo file chooser and overtime Save -> synthetic PG
        run: python3 -u qa-round3/e2e/ci/browser-fingerprint-overtime-success.py
      - name: Honest scope
        if: always()
        run: |
          echo 'Real full QA HTML, Chromium chooser and overtime button, local HTTP bridge and actual disposable PostgreSQL records.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Fake authentication and synthetic RPCs, not original production SQL or actual PostgREST, Android OS picker, full staff E2E or release CLEAN.' >> "$GITHUB_STEP_SUMMARY"
