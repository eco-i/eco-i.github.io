name: QA 2-8-242 real two-tab dialog race (red and green)
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-242-real-dialog.yml"
      - "qa-handoff/QA_242_REAL_DIALOG.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chrome-dialog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa242dlg --no-audit --no-fund playwright-core@1.55.1
      - name: Reproduce red and verify green across two real tabs
        env:
          NODE_PATH: /tmp/qa242dlg/node_modules
        run: node qa-handoff/QA_242_REAL_DIALOG.cjs
