name: QA 2-8-254 annual leave two-year Chromium matrix
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-254-annual.yml"
      - "qa-handoff/QA_254_ANNUAL_LEAVE_MATRIX.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  annual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa254annual --no-audit --no-fund playwright-core@1.55.1
      - name: 2026-2027 all-team annual leave date windows and overlaps PC mobile
        env:
          NODE_PATH: /tmp/qa254annual/node_modules
        run: node qa-handoff/QA_254_ANNUAL_LEAVE_MATRIX.cjs
