# QA246 independent two-tab sensitive UI cache purge repeat
name: QA 2-8-246 two-tab administrator sensitive UI cache purge
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-246-ui-purge.yml"
      - "qa-handoff/QA_246_UI_PURGE.cjs"
      - "qa-handoff/index.working-2-8-246.html"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa246purge --no-audit --no-fund playwright-core@1.55.1
      - name: Real two-tab removal of admin unlock purges privileged UI and PIN cache
        env:
          NODE_PATH: /tmp/qa246purge/node_modules
        run: node qa-handoff/QA_246_UI_PURGE.cjs
