name: QA 2-8-253 scope and tombstone matrix
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-253-matrix.yml"
      - "qa-handoff/QA_253_SCOPE_MATRIX.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa253matrix --no-audit --no-fund playwright-core@1.55.1
      - name: PC and mobile 648 storage authority combinations
        env:
          NODE_PATH: /tmp/qa253matrix/node_modules
        run: node qa-handoff/QA_253_SCOPE_MATRIX.cjs
