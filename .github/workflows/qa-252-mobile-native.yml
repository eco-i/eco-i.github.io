name: QA 2-8-252 mobile native confirmation
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-252-mobile-native.yml"
      - "qa-handoff/QA_252_PHOTO_MOBILE.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa252mobile --no-audit --no-fund playwright-core@1.55.1
      - name: Real mobile Chrome emulator two-tab revocation under photo confirmation
        env:
          NODE_PATH: /tmp/qa252mobile/node_modules
        run: node qa-handoff/QA_252_PHOTO_MOBILE.cjs
