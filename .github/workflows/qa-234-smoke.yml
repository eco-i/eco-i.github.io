name: QA 2-8-234 Chromium smoke
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-234-smoke.yml"
      - "qa-handoff/QA_234_SMOKE.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only Chromium driver
        run: npm install --prefix /tmp/qa-234 --no-audit --no-fund playwright-core@1.55.1
      - name: Run source plus real headless Chrome tests
        env:
          NODE_PATH: /tmp/qa-234/node_modules
        run: node qa-handoff/QA_234_SMOKE.cjs
