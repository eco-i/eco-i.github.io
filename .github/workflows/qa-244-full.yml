name: QA 2-8-244 comprehensive Chromium depth eight
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-244-full.yml"
      - "qa-handoff/QA_244_FULL.cjs"
      - "qa-handoff/index.working-2-8-244.html"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa244full --no-audit --no-fund playwright-core@1.55.1
      - name: Complete original eight-layer actual Chromium suite
        env:
          NODE_PATH: /tmp/qa244full/node_modules
        run: node qa-handoff/QA_244_FULL.cjs
