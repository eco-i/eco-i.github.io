# QA242 independent candidate-stable repeat, same pinned SHA
name: QA 2-8-242 complete Chromium depth-eight regression
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-242-full.yml"
      - "qa-handoff/QA_242_FULL.cjs"
      - "qa-handoff/index.working-2-8-242.html"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa-242-full --no-audit --no-fund playwright-core@1.55.1
      - name: Complete inherited eight-layer regression with real Chromium
        env:
          NODE_PATH: /tmp/qa-242-full/node_modules
        run: node qa-handoff/QA_242_FULL.cjs
