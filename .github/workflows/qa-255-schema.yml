name: QA 2-8-255 backup schema Chromium
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-255-schema.yml"
      - "qa-handoff/QA_255_BACKUP_SCHEMA.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa255schema --no-audit --no-fund playwright-core@1.55.1
      - name: Schema strictness and backup preview mobile and desktop
        env:
          NODE_PATH: /tmp/qa255schema/node_modules
        run: node qa-handoff/QA_255_BACKUP_SCHEMA.cjs
