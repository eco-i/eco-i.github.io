name: Workmoa QA 2026 overtime allowance isolated Chromium render
on:
  push:
    branches:
      - qa-round3-overtime-integration-20261107
    paths:
      - 'index.html'
      - 'qa-round3/e2e/ci/browser-overtime-allowance-integration.py'
      - '.github/workflows/workmoa-qa-overtime-allowance-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workmoa-qa-overtime-allowance-integration
  cancel-in-progress: true
jobs:
  synthetic-chromium-overtime-allowance:
    if: github.repository == 'eco-i/eco-i.github.io' && github.ref == 'refs/heads/qa-round3-overtime-integration-20261107'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qa_runner
          POSTGRES_PASSWORD: synthetic_ci_only_not_a_real_secret
          POSTGRES_DB: qa_round3
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U qa_runner -d qa_round3"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: '127.0.0.1'
      PGPORT: '5432'
      PGDATABASE: qa_round3
      PGUSER: qa_runner
      PGPASSWORD: synthetic_ci_only_not_a_real_secret
    steps:
      - name: Checkout QA-only branch without credential persistence
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject production environment and validate scoped source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'eco-i/eco-i.github.io'
          test "$GITHUB_REF" = 'refs/heads/qa-round3-overtime-integration-20261107'
          test "$(git branch --show-current)" = 'qa-round3-overtime-integration-20261107'
          test -z "${DATABASE_URL:-}"
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${QA_SUPABASE_URL:-}"
          test -z "${QA_SUPABASE_ANON_KEY:-}"
          test -z "${DOCKER_HOST:-}"
          test -z "${DOCKER_CONTEXT:-}"
          python3 -m py_compile qa-round3/e2e/ci/browser-overtime-allowance-integration.py
          if ! command -v psql >/dev/null; then
            timeout 120s sudo apt-get update -qq
            timeout 120s sudo apt-get install -y -qq postgresql-client
          fi
          timeout 150s python3 -m pip install --disable-pip-version-check --timeout 30 --retries 2 'playwright==1.56.0' 'psycopg[binary]==3.2.10'
          timeout 210s python3 -m playwright install --with-deps chromium
      - name: Seed disposable artificial QA database (no real staff)
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f qa-round3/e2e/ci/synthetic-baseline.sql
          psql -X -v ON_ERROR_STOP=1 -f qa-round3/e2e/ci/attendance-form-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f qa-round3/e2e/ci/fingerprint-overtime-browser-fixture.sql
      - name: Real Chromium app DOM synthetic overtime allowance checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -u qa-round3/e2e/ci/browser-overtime-allowance-integration.py
      - name: Record precise limits
        if: always()
        shell: bash
        run: |
          {
            echo 'QA scope: original complete QA HTML + real Chromium DOM rendering + isolated fake employee login.'
            echo 'Scenario data: synthetic in-memory holiday/overtime entries; no production employee rows or network requests.'
            echo 'Not verified: actual holiday RPC/production PostgreSQL SQL equivalence, original Supabase Auth/RLS, multi-device writes or release CLEAN.'
            echo 'Operating main, original qa-3-8 and production Supabase remain untouched.'
          } >> "$GITHUB_STEP_SUMMARY"
