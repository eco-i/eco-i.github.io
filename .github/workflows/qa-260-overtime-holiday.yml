name: QA 2-8-260 holiday work and overtime negative mutation
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-260-overtime-holiday.yml"
      - "qa-handoff/QA_260_OVERTIME_HOLIDAY.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  overtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa260overtime --no-audit --no-fund playwright-core@1.55.1
      - name: Chrome PC/mobile holiday and overtime strict protocol boundary mutation
        env:
          NODE_PATH: /tmp/qa260overtime/node_modules
        run: node qa-handoff/QA_260_OVERTIME_HOLIDAY.cjs
