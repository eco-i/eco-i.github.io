name: Workmoa QA 3-cycle dirty baseline mutation trace
on:
  push:
    branches: [qa-3-8]
    paths:
      - '.github/workflows/workmoa-qa-overtime-readiness-stress.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workmoa-qa-overtime-readiness-stress
  cancel-in-progress: true
jobs:
  isolated-10-cycle-readiness:
    if: github.repository == 'eco-i/eco-i.github.io' && github.ref == 'refs/heads/qa-3-8'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qa_runner
          POSTGRES_PASSWORD: synthetic_ci_only_not_a_real_secret
          POSTGRES_DB: qa_round3
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U qa_runner -d qa_round3"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: qa_round3
      PGUSER: qa_runner
      PGPASSWORD: synthetic_ci_only_not_a_real_secret
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Local-only environment and browser dependency validation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = eco-i/eco-i.github.io
          test "$GITHUB_REF" = refs/heads/qa-3-8
          test "$(git branch --show-current)" = qa-3-8
          test -z "${DATABASE_URL:-}"
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${QA_SUPABASE_URL:-}"
          test -z "${QA_SUPABASE_ANON_KEY:-}"
          if ! command -v psql >/dev/null; then
            timeout 120s sudo apt-get update -qq
            timeout 120s sudo apt-get install -y -qq postgresql-client
          fi
          timeout 150s python3 -m pip install --disable-pip-version-check --timeout 30 --retries 2 'playwright==1.56.0' 'psycopg[binary]==3.2.10'
          echo 'QA_BROWSER_INSTALL_BOUND=210s'
          timeout 210s python3 -m playwright install --with-deps chromium
          python3 -m py_compile qa-round3/e2e/ci/browser-fingerprint-overtime-success.py
      - name: Seed disposable synthetic PostgreSQL only
        run: |
          psql -X -v ON_ERROR_STOP=1 -f qa-round3/e2e/ci/synthetic-baseline.sql
          psql -X -v ON_ERROR_STOP=1 -f qa-round3/e2e/ci/attendance-form-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f qa-round3/e2e/ci/fingerprint-overtime-browser-fixture.sql
      - name: Repeat isolated readiness final guard diagnostics three times
        shell: bash
        run: |
          set -euo pipefail
          attempts=0
          passed=0
          failed=0
          for scenario in readiness; do
            case "$scenario" in
              readiness) repeat=3; arg="--readiness-ui-probe"; marker="OVERTIME_READINESS_UI_LOCK_SYNTHETIC_PG_PASS" ;;
            esac
            for ((i=1;i<=repeat;i++)); do
              attempts=$((attempts+1))
              psql -X -v ON_ERROR_STOP=1 -c "TRUNCATE public.qa_browser_fingerprint, public.qa_browser_overtime RESTART IDENTITY" >/dev/null
              logfile="$(mktemp)"
              begin="$SECONDS"
              if timeout 50s python3 -u qa-round3/e2e/ci/browser-fingerprint-overtime-success.py $arg >"$logfile" 2>&1 && grep -Fq "$marker" "$logfile"; then
                passed=$((passed+1))
                checks="$(grep -c 'PASS real-browser-photo-overtime:' "$logfile" || true)"
                echo "SOAK_PASS scenario=$scenario cycle=$i/$repeat checks=$checks elapsed_seconds=$((SECONDS-begin))"
              else
                failed=$((failed+1))
                echo "SOAK_FAIL scenario=$scenario cycle=$i/$repeat elapsed_seconds=$((SECONDS-begin))"
                tail -n 75 "$logfile"
              fi
              rm -f "$logfile"
            done
          done
          echo "SOAK_TOTAL attempted=$attempts passed=$passed failed=$failed"
          echo "SOAK_TOTAL attempted=$attempts passed=$passed failed=$failed" >> "$GITHUB_STEP_SUMMARY"
          test "$attempts" -eq 3
          test "$passed" -eq 3
          test "$failed" -eq 0
      - name: Honest scope
        if: always()
        run: |
          echo '10 independent Chromium / local PostgreSQL runs testing in-flight personnel read lock/unlock without synthetic promise interference.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No production or Supabase access, fake identities/synthetic RPCs only; this is NOT Android/operational E2E, nor 3-8-54 or release CLEAN.' >> "$GITHUB_STEP_SUMMARY"
