name: QA 2-8-256 admin malformed import RPC fence
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-256-admin-restore-guard.yml"
      - "qa-handoff/QA_256_ADMIN_RESTORE_GUARD.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa256admrestore --no-audit --no-fund playwright-core@1.55.1
      - name: Actual admin restore import file schema and session RPC ownership
        env:
          NODE_PATH: /tmp/qa256admrestore/node_modules
        run: node qa-handoff/QA_256_ADMIN_RESTORE_GUARD.cjs
