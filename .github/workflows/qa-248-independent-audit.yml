name: QA 2-8-248 independent final browser and immutable audit
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-248-independent-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa248ind --no-audit --no-fund playwright-core@1.55.1
      - name: Exact official source delta and final candidate integrity
        run: node qa-handoff/QA_248_INTEGRITY.cjs
      - name: Complete actual Chromium depth eight, independent repeated run
        env:
          NODE_PATH: /tmp/qa248ind/node_modules
        run: node qa-handoff/QA_248_FULL.cjs
