name: QA 2-8-240 patch exact-token revocation
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-240-patch.yml"
      - "qa-handoff/QA_240_PATCH.cjs"
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa-2-8
      - name: Apply exact logout tombstone security fixes
        run: node qa-handoff/QA_240_PATCH.cjs
      - name: Verify then commit QA-only files
        run: |
          git diff --check
          git add index.html qa-handoff/index.working-2-8-240.html
          git diff --cached --stat
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='qa-verification-bot' -c user.email='qa-verification-bot@users.noreply.github.com' commit -m 'fix(2-8-240): fence tombstoned sessions and immediately revoke cross-tab admin views'
          git fetch origin qa-2-8
          git rebase origin/qa-2-8
          git push origin HEAD:qa-2-8
