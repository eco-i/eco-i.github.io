name: QA 2-8-260 restricted browser storage and Web Locks
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-260-storage-privacy.yml"
      - "qa-handoff/QA_260_STORAGE_PRIVACY.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa260privacy --no-audit --no-fund playwright-core@1.55.1
      - name: Real PC/mobile Chrome boot with denied local/session storage and unavailable Web Locks
        env:
          NODE_PATH: /tmp/qa260privacy/node_modules
        run: node qa-handoff/QA_260_STORAGE_PRIVACY.cjs
