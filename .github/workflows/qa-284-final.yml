name: QA 2-8-284 promoted 285 baseline SHA and real Chrome boot
on:
  push:
    branches: [qa-2-8]
    paths:
      - "qa-handoff/index.before-2-8-285.html"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  final-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa284final --no-audit --no-fund playwright-core@1.55.1
      - name: Verify official 284 state, 285 immutable start and real Chrome PC/mobile boot
        env:
          NODE_PATH: /tmp/qa284final/node_modules
        run: node qa-handoff/QA_284_POST_PROMOTE.cjs
