name: Workmoa QA holiday and overtime error visibility (synthetic UI negative tests)

on:
  push:
    branches: [qa-3-8]
    paths:
      - '.github/workflows/workmoa-qa-holiday-overtime-errors.yml'
      - 'qa-round3/e2e/ci/browser-holiday-overtime-failures.py'
      - 'qa-round3/e2e/ci/holiday-overtime-error-fixture.sql'
      - 'qa-round3/e2e/ci/browser-attendance-form.py'
      - 'qa-round3/e2e/ci/browser-postgres-bridge.py'
      - 'qa-round3/e2e/ci/synthetic-baseline.sql'
      - 'qa-round3/e2e/ci/attendance-form-fixture.sql'
      - 'qa-round3/e2e/prepare-local-qa-site.mjs'
      - 'qa-round3/e2e/serve-local-qa-site.mjs'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workmoa-qa-holiday-overtime-errors-3-8
  cancel-in-progress: true

jobs:
  failed-save-ui-regression:
    if: github.repository == 'eco-i/eco-i.github.io' && github.ref == 'refs/heads/qa-3-8'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qa_runner
          POSTGRES_PASSWORD: synthetic_ci_only_not_a_real_secret
          POSTGRES_DB: qa_round3
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U qa_runner -d qa_round3"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: qa_round3
      PGUSER: qa_runner
      PGPASSWORD: synthetic_ci_only_not_a_real_secret
    steps:
      - name: Checkout QA branch, never persist GitHub credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12 and Node 22
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert strict disconnected synthetic scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = eco-i/eco-i.github.io
          test "$GITHUB_REF" = refs/heads/qa-3-8
          test "$(git branch --show-current)" = qa-3-8
          test -z "${DATABASE_URL:-}"
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${QA_SUPABASE_URL:-}"
          test -z "${QA_SUPABASE_ANON_KEY:-}"
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          python3 -m pip install --disable-pip-version-check 'playwright==1.56.0' 'psycopg[binary]==3.2.10'
          python3 -m playwright install --with-deps chromium
          python3 -m py_compile qa-round3/e2e/ci/browser-holiday-overtime-failures.py
      - name: Setup ONLY disposable fake-employee PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f qa-round3/e2e/ci/synthetic-baseline.sql
          psql -X -v ON_ERROR_STOP=1 -f qa-round3/e2e/ci/attendance-form-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f qa-round3/e2e/ci/holiday-overtime-error-fixture.sql
      - name: Test genuine holiday and overtime Save UI rejection paths
        run: python3 -u qa-round3/e2e/ci/browser-holiday-overtime-failures.py
      - name: Honest E2E scope note
        if: always()
        run: |
          {
            echo '## Real UI error-message and draft-preservation checks ONLY'
            echo '- Original QA app HTML and actual Chromium button clicks, fake worker session, local synthetic PostgreSQL.'
            echo '- Simulated PostgREST-shaped 404 for holiday and stale-CAS 409 for overtime.'
            echo '- Neither actual production RPC source nor PostgREST/Auth/RLS is reproduced.'
            echo '- Full production E2E remains blocked and release not approved.'
          } >> "$GITHUB_STEP_SUMMARY"
