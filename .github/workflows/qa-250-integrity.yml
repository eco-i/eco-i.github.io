name: QA 2-8-250 independent SHA JS DOM integrity
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-250-integrity.yml"
      - "qa-handoff/QA_250_INTEGRITY.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Immutable 250 baseline, exact candidate SHA, 457 DOM IDs and source diff audit
        run: node qa-handoff/QA_250_INTEGRITY.cjs
