name: QA 2-8-251 PC mobile scope matrix Chromium
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-251-matrix.yml"
      - "qa-handoff/QA_251_SCOPE_MATRIX.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa251matrix --no-audit --no-fund playwright-core@1.55.1
      - name: Mobile and desktop combinations with admin scope and exact token tombstones
        env:
          NODE_PATH: /tmp/qa251matrix/node_modules
        run: node qa-handoff/QA_251_SCOPE_MATRIX.cjs
