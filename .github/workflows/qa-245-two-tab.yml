# QA245 third independent real Chrome cross-renderer native dialog check
# QA245 independent native-dialog two-tab repeat after just-in-time admin fence
name: QA 2-8-245 real two-tab native dialog admin unlock revocation
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-245-two-tab.yml"
      - "qa-handoff/QA_245_REAL_CROSS_TAB.cjs"
      - "qa-handoff/index.working-2-8-245.html"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa245twotab --no-audit --no-fund playwright-core@1.55.1
      - name: Cross-renderer real native confirm and admin unlock revocation
        env:
          NODE_PATH: /tmp/qa245twotab/node_modules
        run: node qa-handoff/QA_245_REAL_CROSS_TAB.cjs
