name: QA 2-8-239 deep Chromium regression
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-239-smoke.yml"
      - "qa-handoff/QA_239_SMOKE.cjs"
      - "qa-handoff/index.working-2-8-239.html"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa-239 --no-audit --no-fund playwright-core@1.55.1
      - name: Run 239 real Chromium eight-layer suite
        env:
          NODE_PATH: /tmp/qa-239/node_modules
        run: node qa-handoff/QA_239_SMOKE.cjs
