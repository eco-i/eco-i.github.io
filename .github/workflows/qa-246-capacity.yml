name: QA 2-8-246 Chrome admin capacity read RPC authorization
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-246-capacity.yml"
      - "qa-handoff/QA_246_CAPACITY_READ.cjs"
      - "qa-handoff/index.working-2-8-246.html"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa246capacity --no-audit --no-fund playwright-core@1.55.1
      - name: Test dynamic supplemental administrator capacity RPC access in real Chrome
        env:
          NODE_PATH: /tmp/qa246capacity/node_modules
        run: node qa-handoff/QA_246_CAPACITY_READ.cjs
