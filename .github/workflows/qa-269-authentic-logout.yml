name: QA 265 authentic shared logout marker under four-runner contention
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-269-authentic-logout.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  logout-marker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1,2,3,4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa269authentic --no-audit --no-fund playwright-core@1.55.1
      - name: Verify supported logout protocol with token specific suppression and peer storage change
        env:
          NODE_PATH: /tmp/qa269authentic/node_modules
        shell: bash
        run: |
          set -euo pipefail
          node qa-handoff/QA_269_ADAPT.cjs QA_256_RESTORE_RACE
          node qa-handoff/QA_269_LOGOUT_BUILDER.cjs
          for round in $(seq 1 4); do
            if ! node qa-handoff/QA_269_LOGOUT_RACE.generated.cjs > /tmp/qa269-logout.log 2>&1; then
              echo "QA269_AUTHENTIC_LOGOUT_FAIL shard=${{ matrix.shard }} round=$round"
              grep -E 'FAIL|SUMMARY|ERROR' /tmp/qa269-logout.log | tail -n 14
              exit 1
            fi
            grep QA256_RESTORE_RACE_SUMMARY /tmp/qa269-logout.log | tail -n 1
          done
          echo "QA269_AUTHENTIC_LOGOUT_PASS shard=${{ matrix.shard }} repeats=4 checks=160"
