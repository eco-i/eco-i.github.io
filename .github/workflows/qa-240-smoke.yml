name: QA 2-8-240 real Chromium eight-layer
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-240-smoke.yml"
      - "qa-handoff/QA_240_SMOKE.cjs"
      - "qa-handoff/index.working-2-8-240.html"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa-240 --no-audit --no-fund playwright-core@1.55.1
      - name: Actual browser 8-layer 240 regression
        env:
          NODE_PATH: /tmp/qa-240/node_modules
        run: node qa-handoff/QA_240_SMOKE.cjs
