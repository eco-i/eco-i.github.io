name: QA 2-8-259 strict DDAY and event mutation matrices
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-259-event-dday.yml"
      - "qa-handoff/QA_259_EVENT_DDAY.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  events:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa259events --no-audit --no-fund playwright-core@1.55.1
      - name: PC/mobile event and DDAY strict response + HTML injection property battery
        env:
          NODE_PATH: /tmp/qa259events/node_modules
        run: node qa-handoff/QA_259_EVENT_DDAY.cjs
