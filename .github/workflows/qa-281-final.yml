name: QA 2-8-281 promoted 282 baseline SHA and real Chrome boot
on:
  push:
    branches: [qa-2-8]
    paths:
      - "qa-handoff/index.before-2-8-282.html"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  final-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa281final --no-audit --no-fund playwright-core@1.55.1
      - name: Verify official 281 state, 282 immutable start and real Chrome PC/mobile boot
        env:
          NODE_PATH: /tmp/qa281final/node_modules
        run: node qa-handoff/QA_281_POST_PROMOTE.cjs
