name: QA 2-8-252 source integrity
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-252-integrity.yml"
      - "qa-handoff/QA_252_INTEGRITY.cjs"
      - "qa-handoff/index.working-2-8-252.html"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node qa-handoff/QA_252_INTEGRITY.cjs
