name: QA 2-8-256 real QA index post-promotion smoke
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-256-index-smoke.yml"
      - "qa-handoff/QA_256_QA_INDEX_SMOKE.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa256index --no-audit --no-fund playwright-core@1.55.1
      - name: Verify live QA index in real Chromium mobile and desktop
        env:
          NODE_PATH: /tmp/qa256index/node_modules
        run: node qa-handoff/QA_256_QA_INDEX_SMOKE.cjs
