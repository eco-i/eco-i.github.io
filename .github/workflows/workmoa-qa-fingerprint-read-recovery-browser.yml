name: Workmoa QA fingerprint read failure recovery Chromium disposable PostgreSQL
on:
  push:
    branches: [qa-3-8]
    paths:
      - 'qa-round3/e2e/ci/browser-fingerprint-overtime-success.py'
      - 'qa-round3/e2e/ci/fingerprint-overtime-browser-fixture.sql'
      - 'qa-round3/e2e/ci/browser-attendance-form.py'
      - 'qa-round3/e2e/ci/browser-postgres-bridge.py'
      - '.github/workflows/workmoa-qa-fingerprint-read-recovery-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workmoa-qa-fingerprint-read-recovery-browser
  cancel-in-progress: true
jobs:
  real-chromium-fake-pg-success:
    if: github.repository == 'eco-i/eco-i.github.io' && github.ref == 'refs/heads/qa-3-8'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qa_runner
          POSTGRES_PASSWORD: synthetic_ci_only_not_a_real_secret
          POSTGRES_DB: qa_round3
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U qa_runner -d qa_round3"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: qa_round3
      PGUSER: qa_runner
      PGPASSWORD: synthetic_ci_only_not_a_real_secret
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Local-only environment and browser dependency validation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = eco-i/eco-i.github.io
          test "$GITHUB_REF" = refs/heads/qa-3-8
          test "$(git branch --show-current)" = qa-3-8
          test -z "${DATABASE_URL:-}"
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -z "${QA_SUPABASE_URL:-}"
          test -z "${QA_SUPABASE_ANON_KEY:-}"
          if ! command -v psql >/dev/null; then
            timeout 120s sudo apt-get update -qq
            timeout 120s sudo apt-get install -y -qq postgresql-client
          fi
          timeout 150s python3 -m pip install --disable-pip-version-check --timeout 30 --retries 2 'playwright==1.56.0' 'psycopg[binary]==3.2.10'
          echo 'QA_BROWSER_INSTALL_BOUND=210s'
          timeout 210s python3 -m playwright install --with-deps chromium
          python3 -m py_compile qa-round3/e2e/ci/browser-fingerprint-overtime-success.py
      - name: Seed disposable synthetic PostgreSQL only
        run: |
          psql -X -v ON_ERROR_STOP=1 -f qa-round3/e2e/ci/synthetic-baseline.sql
          psql -X -v ON_ERROR_STOP=1 -f qa-round3/e2e/ci/attendance-form-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f qa-round3/e2e/ci/fingerprint-overtime-browser-fixture.sql
      - name: Repeat full Chromium fingerprint picker HTTP failure recovery 3 times
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "REAL_UI_SYNTHETIC_DB_ATTEMPT=$attempt"
            psql -X -v ON_ERROR_STOP=1 -c "TRUNCATE public.qa_browser_fingerprint, public.qa_browser_overtime RESTART IDENTITY"
            python3 -u qa-round3/e2e/ci/browser-fingerprint-overtime-success.py --fingerprint-only | tee qa_fingerprint_run.log
            grep -Fq FINGERPRINT_READ_RECOVERY_ISOLATED_CHROMIUM_POSTGRES_PASS qa_fingerprint_run.log
          done
      - name: Honest scope
        if: always()
        run: |
          echo 'Real full QA HTML, Chromium native file chooser, synthetic 503 read failures, recovery UI, local HTTP bridge and disposable PostgreSQL, repeated three times.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Fake authentication and synthetic RPCs. Not actual Android OS picker, original production SQL, PostgREST/Auth/RLS, user records, release approval or 3-8-54 completion.' >> "$GITHUB_STEP_SUMMARY"
