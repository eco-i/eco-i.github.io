name: QA 2-8-253 two-year shift matrix
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-253-shift.yml"
      - "qa-handoff/QA_253_SHIFT_MATRIX.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa253shift --no-audit --no-fund playwright-core@1.55.1
      - name: Exhaustive 730-day four-team overhaul and 8-day recurrence
        env:
          NODE_PATH: /tmp/qa253shift/node_modules
        run: node qa-handoff/QA_253_SHIFT_MATRIX.cjs
