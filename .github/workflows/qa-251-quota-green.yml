name: QA 2-8-251 quota history GREEN Chromium
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-251-quota-green.yml"
      - "qa-handoff/QA_251_HISTORY_QUOTA_GREEN.cjs"
      - "qa-handoff/index.working-2-8-251.html"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa251green --no-audit --no-fund playwright-core@1.55.1
      - name: Candidate quota fault and real two-tab shared authority revocation
        env:
          NODE_PATH: /tmp/qa251green/node_modules
        run: node qa-handoff/QA_251_HISTORY_QUOTA_GREEN.cjs
