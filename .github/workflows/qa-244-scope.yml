name: QA 2-8-244 real Chromium auth scope
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-244-scope.yml"
      - "qa-handoff/QA_244_AUTH_SCOPE.cjs"
      - "qa-handoff/index.working-2-8-244.html"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa244scope --no-audit --no-fund playwright-core@1.55.1
      - name: Verify actual Chrome security gate and admin unlock behavior
        env:
          NODE_PATH: /tmp/qa244scope/node_modules
        run: node qa-handoff/QA_244_AUTH_SCOPE.cjs
