name: QA 2-8-253 real picker input events
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-253-picker.yml"
      - "qa-handoff/QA_253_PICKER_REAL.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  picker:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa253picker --no-audit --no-fund playwright-core@1.55.1
      - name: Real desktop and mobile file input change upload duplicate cancel
        env:
          NODE_PATH: /tmp/qa253picker/node_modules
        run: node qa-handoff/QA_253_PICKER_REAL.cjs
