name: QA 2-8-248 remembered admin role UI purge
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-248-remember-ui.yml"
      - "qa-handoff/QA_248_REMEMBER_UI.cjs"
      - "qa-handoff/index.working-2-8-248.html"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa248r-ui --no-audit --no-fund playwright-core@1.55.1
      - name: Confirm sensitive admin render and PIN cache purged after remembered scope changes
        env:
          NODE_PATH: /tmp/qa248r-ui/node_modules
        run: node qa-handoff/QA_248_REMEMBER_UI.cjs
