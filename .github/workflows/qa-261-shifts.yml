name: QA 2-8-261 full two-year four-shift oracle
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-261-shifts.yml"
      - "qa-handoff/QA_261_SHIFT_INVARIANTS.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shift:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa261shift --no-audit --no-fund playwright-core@1.55.1
      - name: Compare entire 2026-27 daily four-shift and office oracle, 15-day overhaul exception
        env:
          NODE_PATH: /tmp/qa261shift/node_modules
        run: node qa-handoff/QA_261_SHIFT_INVARIANTS.cjs
