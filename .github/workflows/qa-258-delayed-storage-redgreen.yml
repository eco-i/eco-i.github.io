name: QA 2-8-258 controlled cross-renderer delayed-storage RED GREEN
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-258-delayed-storage-redgreen.yml"
      - "qa-handoff/QA_258_DELAYED_STORAGE_RED_GREEN.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa258delayed --no-audit --no-fund playwright-core@1.55.1
      - name: Compare immutable original and repaired real Chrome backup preview after peer logout
        env:
          NODE_PATH: /tmp/qa258delayed/node_modules
        run: node qa-handoff/QA_258_DELAYED_STORAGE_RED_GREEN.cjs
