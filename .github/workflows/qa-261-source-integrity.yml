name: QA 2-8-261 immutable source integrity check
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-261-source-integrity.yml"
      - "qa-handoff/QA_261_SOURCE_INTEGRITY.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  immutable:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate exact QA candidate, 2026-2027 schedules, RPC and DOM with no product code edits
        run: node qa-handoff/QA_261_SOURCE_INTEGRITY.cjs
