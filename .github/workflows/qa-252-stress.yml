name: QA 2-8-252 native cross-tab stress
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-252-stress.yml"
      - "qa-handoff/QA_252_PHOTO_STRESS.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa252stress --no-audit --no-fund playwright-core@1.55.1
      - name: Real Chrome eighteen independent native confirm revoke/login cases
        env:
          NODE_PATH: /tmp/qa252stress/node_modules
        run: node qa-handoff/QA_252_PHOTO_STRESS.cjs
