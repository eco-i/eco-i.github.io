name: QA 2-8-257 independent RPC payload contract mutation
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-257-rpc-contract.yml"
      - "qa-handoff/QA_257_RPC_CONTRACT.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rpc:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa257rpc --no-audit --no-fund playwright-core@1.55.1
      - name: Strict export and restore preview response validation on PC/mobile Chrome
        env:
          NODE_PATH: /tmp/qa257rpc/node_modules
        run: node qa-handoff/QA_257_RPC_CONTRACT.cjs
