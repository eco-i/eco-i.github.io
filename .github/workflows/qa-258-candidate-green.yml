name: QA 2-8-258 GREEN candidate full depth-eight + cross-tab guards
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-258-candidate-green.yml"
      - "qa-handoff/QA_258_ADAPT.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa258green --no-audit --no-fund playwright-core@1.55.1
      - name: Repeated real Chrome 2-tab race and personal/admin restore ownership RED to GREEN
        env:
          NODE_PATH: /tmp/qa258green/node_modules
        shell: bash
        run: |
          set -euo pipefail
          node qa-handoff/QA_258_ADAPT.cjs QA_256_RESTORE_RACE QA_256_RESTORE_GUARD QA_256_ADMIN_RESTORE_GUARD
          for n in $(seq 1 14); do
            if ! node qa-handoff/QA_258_ADAPTED_QA_256_RESTORE_RACE.cjs > /tmp/qa258-one.log 2>&1; then
              echo "QA258_GREEN_RACE_FAIL iteration=$n"
              grep -E 'FAIL|ERROR|SUMMARY' /tmp/qa258-one.log | tail -n 20 || true
              exit 1
            fi
            grep 'SUMMARY' /tmp/qa258-one.log | tail -n 1 || true
          done
          for name in QA_256_RESTORE_GUARD QA_256_ADMIN_RESTORE_GUARD; do
            node qa-handoff/QA_258_ADAPTED_${name}.cjs > /tmp/qa258-${name}.log 2>&1 || { grep -E 'FAIL|ERROR|SUMMARY' /tmp/qa258-${name}.log | tail -n 25; exit 1; }
            grep 'SUMMARY' /tmp/qa258-${name}.log | tail -n 1
          done
          echo "QA258_GREEN_RACE_FINAL successful_iterations=14"
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa258green --no-audit --no-fund playwright-core@1.55.1
      - name: Complete immutable-candidate depth-eight Chromium and RPC response / UI injection
        env:
          NODE_PATH: /tmp/qa258green/node_modules
        shell: bash
        run: |
          set -euo pipefail
          names="QA_256_FULL QA_256_BACKUP_PROPERTY QA_256_CODEC_FUZZ QA_256_SCOPE_MATRIX QA_256_ANNUAL_LEAVE_MATRIX QA_257_RPC_CONTRACT QA_257_SEOUL_MIDNIGHT QA_258_UNTRUSTED_UI QA_258_BACKUP_ROUNDTRIP"
          node qa-handoff/QA_258_ADAPT.cjs $names
          for name in $names; do
            echo "QA258_CANDIDATE_BEGIN $name"
            if ! node qa-handoff/QA_258_ADAPTED_${name}.cjs > /tmp/qa258-one.log 2>&1; then
              grep -E 'FAIL|ERROR|SUMMARY' /tmp/qa258-one.log | tail -n 30 || true
              exit 1
            fi
            grep 'SUMMARY' /tmp/qa258-one.log | tail -n 1 | cut -c 1-1000 || true
          done
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa258green --no-audit --no-fund playwright-core@1.55.1
      - name: Candidate real native dialogs, pickers, photo pipeline, cold boot, admin UI
        env:
          NODE_PATH: /tmp/qa258green/node_modules
        shell: bash
        run: |
          set -euo pipefail
          names="QA_256_HANDOFF_DIALOG QA_256_HANDOFF_STRESS QA_256_PICKER_REAL QA_256_NATIVE_STRESS QA_256_IMAGE_PIPELINE QA_256_REAL_BOOT QA_256_ADMIN_UI"
          node qa-handoff/QA_258_ADAPT.cjs $names
          for name in $names; do
            echo "QA258_CANDIDATE_BEGIN $name"
            if ! node qa-handoff/QA_258_ADAPTED_${name}.cjs > /tmp/qa258-one.log 2>&1; then
              grep -E 'FAIL|ERROR|SUMMARY' /tmp/qa258-one.log | tail -n 25 || true
              exit 1
            fi
            grep 'SUMMARY' /tmp/qa258-one.log | tail -n 1 || true
          done
