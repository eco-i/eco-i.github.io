name: QA 2-8-261 text-scale accessibility and multi-width responsive
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-261-text-scale.yml"
      - "qa-handoff/QA_261_TEXT_SCALE.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa261access --no-audit --no-fund playwright-core@1.55.1
      - name: Real Chrome PC/mobile 60 combinations 2027 December calendar font-size and themes
        env:
          NODE_PATH: /tmp/qa261access/node_modules
        run: node qa-handoff/QA_261_TEXT_SCALE.cjs
