name: QA 2-8-260 audit/capacity/tenure independent fuzz
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-260-admin-security.yml"
      - "qa-handoff/QA_260_ADMIN_SECURITY.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa260security --no-audit --no-fund playwright-core@1.55.1
      - name: Test real Chrome audit logs, capacity metrics, long-service exclusions and text injection
        env:
          NODE_PATH: /tmp/qa260security/node_modules
        run: node qa-handoff/QA_260_ADMIN_SECURITY.cjs
