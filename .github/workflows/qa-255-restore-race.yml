name: QA 2-8-255 cross-tab backup restore file reader
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-255-restore-race.yml"
      - "qa-handoff/QA_255_RESTORE_RACE.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa255race --no-audit --no-fund playwright-core@1.55.1
      - name: Two-tab delayed JSON File.text on mobile and PC
        env:
          NODE_PATH: /tmp/qa255race/node_modules
        run: node qa-handoff/QA_255_RESTORE_RACE.cjs
