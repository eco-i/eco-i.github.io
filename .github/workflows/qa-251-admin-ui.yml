name: QA 2-8-251 revoked admin UI quota Chromium
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-251-admin-ui.yml"
      - "qa-handoff/QA_251_ADMIN_UI_QUOTA.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa251ui --no-audit --no-fund playwright-core@1.55.1
      - name: Four real tab-login admin UI quota and credential removal scenarios
        env:
          NODE_PATH: /tmp/qa251ui/node_modules
        run: node qa-handoff/QA_251_ADMIN_UI_QUOTA.cjs
