name: QA 2-8-246 actual Chrome administrator read response revocation
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-246-response.yml"
      - "qa-handoff/QA_246_ADMIN_RESPONSE.cjs"
      - "qa-handoff/index.working-2-8-246.html"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa246response --no-audit --no-fund playwright-core@1.55.1
      - name: Mid-flight admin unlock demotion and read-only on restore and capacity metadata RPCs
        env:
          NODE_PATH: /tmp/qa246response/node_modules
        run: node qa-handoff/QA_246_ADMIN_RESPONSE.cjs
