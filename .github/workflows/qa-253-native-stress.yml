name: QA 2-8-253 native photo cross-tab stress
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-253-native-stress.yml"
      - "qa-handoff/QA_253_NATIVE_STRESS.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa253stress --no-audit --no-fund playwright-core@1.55.1
      - name: Eighteen independent Chromium photo prompt revocation scenarios
        env:
          NODE_PATH: /tmp/qa253stress/node_modules
        run: node qa-handoff/QA_253_NATIVE_STRESS.cjs
