# QA247 repeat exact source-delta and pinned SHA source integrity on same candidate
name: QA 2-8-247 exact security source diff and immutable baseline integrity
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-247-integrity.yml"
      - "qa-handoff/QA_247_INTEGRITY.cjs"
      - "qa-handoff/index.working-2-8-247.html"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify immutable SHA and exact one-function source patch
        run: node qa-handoff/QA_247_INTEGRITY.cjs
