name: QA 2-8-260 parallel complete High eight-depth Chromium
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-260-full.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa260full --no-audit --no-fund playwright-core@1.55.1
      - name: Complete real Chromium full browser, RPC, image and calendar regression
        env:
          NODE_PATH: /tmp/qa260full/node_modules
        shell: bash
        run: |
          set -euo pipefail
          names="QA_256_FULL QA_257_EDGE QA_257_RPC_CONTRACT QA_257_SEOUL_MIDNIGHT QA_258_UNTRUSTED_UI QA_258_BACKUP_ROUNDTRIP QA_259_EVENT_DDAY QA_259_FINGERPRINT QA_259_PERSONNEL"
          node qa-handoff/QA_260_ADAPT.cjs $names
          for name in $names; do
            echo "QA260_FULL_BEGIN $name"
            if ! node qa-handoff/QA_260_ADAPTED_${name}.cjs > /tmp/qa260-full.log 2>&1; then
              grep -E 'FAIL|ERROR|SUMMARY|AssertionError' /tmp/qa260-full.log | tail -n 25 || true
              exit 1
            fi
            grep 'SUMMARY' /tmp/qa260-full.log | tail -n 1 | cut -c 1-530 || true
          done
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa260backend --no-audit --no-fund playwright-core@1.55.1
      - name: Revalidate backup property, codec, session, restore race and annual leave
        env:
          NODE_PATH: /tmp/qa260backend/node_modules
        shell: bash
        run: |
          set -euo pipefail
          names="QA_256_BACKUP_PROPERTY QA_256_CODEC_FUZZ QA_256_RESTORE_RACE QA_256_RESTORE_GUARD QA_256_ADMIN_RESTORE_GUARD QA_256_SCOPE_MATRIX QA_256_ANNUAL_LEAVE_MATRIX"
          node qa-handoff/QA_260_ADAPT.cjs $names
          for name in $names; do
            if ! node qa-handoff/QA_260_ADAPTED_${name}.cjs > /tmp/qa260-back.log 2>&1; then
              grep -E 'FAIL|ERROR|SUMMARY|AssertionError' /tmp/qa260-back.log | tail -n 25 || true
              exit 1
            fi
            grep 'SUMMARY' /tmp/qa260-back.log | tail -n 1 | cut -c 1-530 || true
          done
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa260front --no-audit --no-fund playwright-core@1.55.1
      - name: Real native dialog, picker, photo, Chrome boot and admin UI regression
        env:
          NODE_PATH: /tmp/qa260front/node_modules
        shell: bash
        run: |
          set -euo pipefail
          names="QA_256_HANDOFF_DIALOG QA_256_HANDOFF_STRESS QA_256_PICKER_REAL QA_256_NATIVE_STRESS QA_256_IMAGE_PIPELINE QA_256_REAL_BOOT QA_256_ADMIN_UI"
          node qa-handoff/QA_260_ADAPT.cjs $names
          for name in $names; do
            if ! node qa-handoff/QA_260_ADAPTED_${name}.cjs > /tmp/qa260-front.log 2>&1; then
              grep -E 'FAIL|ERROR|SUMMARY|AssertionError' /tmp/qa260-front.log | tail -n 25 || true
              exit 1
            fi
            grep 'SUMMARY' /tmp/qa260-front.log | tail -n 1 | cut -c 1-530 || true
          done
