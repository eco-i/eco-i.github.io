# QA243 independent candidate-stable Chromium repeat after scoped fixes (same SHA)
name: QA 2-8-243 comprehensive Chromium depth eight
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-243-full.yml"
      - "qa-handoff/QA_243_FULL.cjs"
      - "qa-handoff/index.working-2-8-243.html"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa243full --no-audit --no-fund playwright-core@1.55.1
      - name: Validate complete Chrome depth-eight regression
        env:
          NODE_PATH: /tmp/qa243full/node_modules
        run: node qa-handoff/QA_243_FULL.cjs
