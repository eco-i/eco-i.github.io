name: QA 2-8-259 mobile and desktop large-list render regression
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-259-list-scale.yml"
      - "qa-handoff/QA_259_LIST_SCALE.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  list-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa259lists --no-audit --no-fund playwright-core@1.55.1
      - name: Render 900 untrusted calendar event and personal memo rows on PC/mobile Chrome
        env:
          NODE_PATH: /tmp/qa259lists/node_modules
        run: node qa-handoff/QA_259_LIST_SCALE.cjs
