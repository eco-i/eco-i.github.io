name: QA 2-8-256 malformed backup never reaches RPC
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-256-restore-guard.yml"
      - "qa-handoff/QA_256_RESTORE_GUARD.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa256restoreguard --no-audit --no-fund playwright-core@1.55.1
      - name: Native personal restore UI accepts only numeric schema v1 before network
        env:
          NODE_PATH: /tmp/qa256restoreguard/node_modules
        run: node qa-handoff/QA_256_RESTORE_GUARD.cjs
