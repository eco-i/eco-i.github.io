name: QA 2-8-248 real Chrome remembered admin marker revocation
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-248-remember.yml"
      - "qa-handoff/QA_248_REMEMBER_COLLISION.cjs"
      - "qa-handoff/index.working-2-8-248.html"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa248remember --no-audit --no-fund playwright-core@1.55.1
      - name: Run real Chrome interrupted remembered administrator cleanup
        env:
          NODE_PATH: /tmp/qa248remember/node_modules
        run: node qa-handoff/QA_248_REMEMBER_COLLISION.cjs
