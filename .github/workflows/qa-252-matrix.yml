name: QA 2-8-252 session scope matrix
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-252-matrix.yml"
      - "qa-handoff/QA_252_SCOPE_MATRIX.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa252matrix --no-audit --no-fund playwright-core@1.55.1
      - name: Chrome matrix 648 PC mobile session authority and tombstones
        env:
          NODE_PATH: /tmp/qa252matrix/node_modules
        run: node qa-handoff/QA_252_SCOPE_MATRIX.cjs
