name: QA 2-8-261 browser tab navigation and accessibility semantics
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-261-nav-a11y.yml"
      - "qa-handoff/QA_261_NAV_A11Y.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa261nav --no-audit --no-fund playwright-core@1.55.1
      - name: Verify labeled login and full keyboard/ARIA four-tab navigation on PC/mobile Chrome
        env:
          NODE_PATH: /tmp/qa261nav/node_modules
        run: node qa-handoff/QA_261_NAV_A11Y.cjs
