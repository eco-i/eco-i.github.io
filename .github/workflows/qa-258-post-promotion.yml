name: QA 2-8-258 post-promotion final source chain and Chrome smoke
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-258-post-promotion.yml"
      - "index.html"
      - "qa-handoff/index.before-2-8-259.html"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  post-promotion:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa258post --no-audit --no-fund playwright-core@1.55.1
      - name: Verify promoted SHA chain and run desktop/mobile Chrome QA index smoke
        env:
          NODE_PATH: /tmp/qa258post/node_modules
        run: node qa-handoff/QA_258_POST_PROMOTE.cjs
