name: QA 2-8-252 photo native confirmation
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-252-photo-native.yml"
      - "qa-handoff/QA_252_PHOTO_NATIVE.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa252native --no-audit --no-fund playwright-core@1.55.1
      - name: Real Chrome two-tab photo upload and revocation
        env:
          NODE_PATH: /tmp/qa252native/node_modules
        run: node qa-handoff/QA_252_PHOTO_NATIVE.cjs
