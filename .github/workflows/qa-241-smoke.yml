name: QA 2-8-241 actual Chromium depth-eight regression
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-241-smoke.yml"
      - "qa-handoff/QA_241_SMOKE.cjs"
      - "qa-handoff/index.working-2-8-241.html"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa-241 --no-audit --no-fund playwright-core@1.55.1
      - name: Real Chromium depth-eight regression and multi-tab security
        env:
          NODE_PATH: /tmp/qa-241/node_modules
        run: node qa-handoff/QA_241_SMOKE.cjs
