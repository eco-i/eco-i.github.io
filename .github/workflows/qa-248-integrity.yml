name: QA 2-8-248 source integrity
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-248-integrity.yml"
      - "qa-handoff/QA_248_INTEGRITY.cjs"
      - "qa-handoff/index.working-2-8-248.html"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact scoped patch, SHA, bytes, DOM, JS syntax
        run: node qa-handoff/QA_248_INTEGRITY.cjs
