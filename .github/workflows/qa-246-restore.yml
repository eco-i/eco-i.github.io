name: QA 2-8-246 Chrome personnel restore revision permission
on:
  push:
    branches: [qa-2-8]
    paths:
      - ".github/workflows/qa-246-restore.yml"
      - "qa-handoff/QA_246_RESTORE_REVISION.cjs"
      - "qa-handoff/index.working-2-8-246.html"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/qa246restore --no-audit --no-fund playwright-core@1.55.1
      - name: Verify authorization of snapshot revision and matched administrator reads
        env:
          NODE_PATH: /tmp/qa246restore/node_modules
        run: node qa-handoff/QA_246_RESTORE_REVISION.cjs
